        grace:
          type: object
          description: Minutes before/after the scheduled start and end. See docs/API.md §Grace.
          properties:
            earlyMin: { type: integer, default: 15, description: May clock in up to N min before the scheduled start }
            lateMin: { type: integer, default: 5, description: Not marked late until N min after the start }
            leaveEarlyMin: { type: integer, default: 5 }
            stayLateMin: { type: integer, default: 10, description: Clock-outs within N min after the end are paid to the scheduled end }
            earlyPay: { type: string, enum: [scheduled, actual], default: scheduled, description: Early clock-in inside the window is paid from the scheduled start or the actual punch }
            blockOutsideGrace: { type: boolean, default: false, description: Block clock-in more than earlyMin before the start }
        permissions:
          type: array
          items: { type: object, required: [key], properties: { key: { $ref: '#/components/schemas/PermissionKey' }, owner: { type: boolean }, admin: { type: boolean }, supervisor: { type: boolean }, employee: { type: boolean } } }
