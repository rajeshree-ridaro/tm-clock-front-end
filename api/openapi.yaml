        tokenSet: { type: boolean }
        tokenLast4: { type: [string, 'null'] }
        tokenSetAt: { type: [string, 'null'], format: date-time }
        fromNumber: { type: [string, 'null'] }
        senderId: { type: [string, 'null'] }
        webhookUrl: { type: string }
        status: { type: string, enum: [none, saved, verified, failed] }
        testedAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
