      type: string
      enum: [company.settings, users.manage, sites.manage, payroll.export, pay.view, punch.approve, briefing.give, punch.crew, punch.edit, location.override, timecards.approve, payperiod.editLocked, punch.self]
    UserRef: { type: object, properties: { id: { $ref: '#/components/schemas/Id' }, name: { type: string }, initials: { type: string } } }
