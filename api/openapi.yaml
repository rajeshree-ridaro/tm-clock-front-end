        timezone: { type: string }
        weekStart: { type: string, enum: [sun, mon] }
        language: { type: string, enum: [en, es] }
    CompanySettings:
      type: object
      properties:
        payPeriod: { type: object, properties: { type: { type: string, enum: [weekly, biweekly, semimonthly] }, anchorDate: { type: string, format: date } } }
        overtime:
          type: object
          properties:
            ruleKey: { type: [string, 'null'], enum: [null, federal, CA, AK, NV, CO, MN, PR, custom] }
            perSite: { type: boolean }
            nvLowWage: { type: boolean }
            prAltWeek: { type: boolean }
            custom: { type: object, properties: { weeklyHours: { type: integer }, dailyHours: { type: [integer, 'null'] }, doubleAfter: { type: [integer, 'null'] }, seventhDay: { type: boolean } } }
        rounding: { type: integer, enum: [0, 5, 6, 10, 15] }
        location:
          type: object
          properties:
            required: { type: boolean }
            photoRequired: { type: boolean }
            radiusFt: { type: integer, minimum: 50, maximum: 10000, default: 500 }
            unit: { type: string, enum: [ft, m] }
            outsideRule: { type: string, enum: [block, flag, allow], default: flag }
